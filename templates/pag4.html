<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAIKI.EXE - Point Click</title>

<link rel="stylesheet" href="../static/pag4.css">
<link rel="stylesheet" href="../static/back-button.css">

</head>

<body class="game-page">

<a href="hub.html" class="hub-back" aria-label="Voltar para o hub">back</a>

<main class="game-shell" id="game">

<header class="game-hud" aria-label="Interface do jogo">
<div>
<span class="hud-kicker">DAIKI.EXE</span>
<h1>POINT CLICK</h1>
</div>

<div class="hud-status">
<span id="sceneName">QUARTO</span>
<span id="nostalgiaScore">NOSTALGIA 0</span>
<span id="connectionScore">CONNECTION 0</span>
</div>
</header>

<section class="scene-wrap" aria-label="Cena atual">
<div id="scene" class="scene" data-scene="quarto">
<div class="scene-glow"></div>
<div id="hotspots" class="hotspots"></div>
</div>
</section>

<aside id="dialogBox" class="dialog hidden" aria-live="polite">
<div id="dialogName" class="dialog-name">DAIKI</div>
<p id="dialogText"></p>
<div id="choiceBox" class="choices"></div>
<button id="dialogNext" class="dialog-next" type="button">avancar</button>
</aside>

<section id="endingScreen" class="ending-screen hidden" aria-live="polite">
<div class="ending-panel">
<span id="endingCode" class="ending-code">ENDING</span>
<h2 id="endingTitle"></h2>
<p id="endingText"></p>
<button id="restartGame" type="button">reiniciar</button>
</div>
</section>

</main>

<div class="crt-overlay" aria-hidden="true"></div>

<script src="../static/pag4.js"></script>

</body>

</html>
